app = 'miyunime-creator-hub'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3000'
  HOST = '0.0.0.0'
  DATABASE_FILE = '/data/miyunime.db'

[[mounts]]
  source = 'miyunime_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = 'GET'
    path = '/healthz'
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
