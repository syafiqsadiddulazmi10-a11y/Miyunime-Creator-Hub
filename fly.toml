# fly.toml app configuration file generated for miyunime-creator-hub on 2026-11-12T04:43:13Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'miyunime-creator-hub'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATABASE_FILE = '/data/miyunime.db'
  HOST = '0.0.0.0'
  PORT = '3000'

[[mounts]]
  source = 'miyunime_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
